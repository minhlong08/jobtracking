name: Daily intern scrape

on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC = 6am AEST / 7am AEDT
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/pyproject.toml

      - name: Install scraper
        run: |
          pip install -e scraper
          python -m playwright install --with-deps chromium

      - name: Scrape, update data, send email
        run: python -m tracker.run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      # Keep the data even if the email step failed.
      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "intern-tracker-bot"
          git config user.email "intern-tracker-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: daily update $(TZ=Australia/Sydney date +%F)"
          git push

      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build job board
        if: ${{ !cancelled() }}
        working-directory: site
        run: npm ci && npm run build

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: site/dist

  deploy:
    needs: scrape
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
